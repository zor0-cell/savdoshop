# Render blueprint (Week 3). Values marked CHANGE-ME are filled in on the Render site,
# never committed as real secrets.
services:
  - type: web
    name: savdoshop
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL   # Supabase Session pooler string, URL-encoded password
        value: CHANGE-ME
      - key: PGSSL
        value: "true"
      - key: MONGODB_URI    # MongoDB Atlas srv string, URL-encoded password
        value: CHANGE-ME
      - key: MONGODB_DB
        value: savdoshop
